name: Process task reminders

on:
  # No `schedule:` trigger — GitHub Actions cron timing isn't guaranteed
  # (can slip several minutes under load, worse for low-activity repos),
  # so cron-job.org now calls POST /api/cron/reminders every minute instead.
  # Kept as workflow_dispatch only, for manual testing.
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call POST /api/cron/reminders
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ vars.APP_URL }}/api/cron/reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Reminder cron call failed"
            exit 1
          fi
